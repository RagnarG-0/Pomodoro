<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ei-Box Test</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #eeede9;
  --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
  --text: #1a1a18; --text-muted: #6b6b66; --accent: #1D9E75;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1e1e1c; --surface2: #272725;
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
    --text: #f0efe9; --text-muted: #8a8a82; --accent: #5DCAA5;
  }
}

body {
  font-family: 'Georgia', 'Times New Roman', serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 2rem 1rem 4rem; gap: 16px;
}

.test-banner {
  font-family: -apple-system, sans-serif; font-size: 11px;
  background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);
  color: #b45309; padding: 5px 14px; border-radius: 6px; letter-spacing: 0.02em;
}
@media (prefers-color-scheme: dark) { .test-banner { color: #fbbf24; } }

/* ── Fehler-Banner ── */
#diamondBanner {
  width: 100%; max-width: 400px;
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 10px; padding: 10px 16px;
  font-family: -apple-system, sans-serif; font-size: 13px;
  color: #dc2626; text-align: center; display: none;
}
@media (prefers-color-scheme: dark) { #diamondBanner { color: #f87171; } }
#diamondBanner.visible { display: block; }

/* ── Container-Karte ── */
.card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 0.5px solid var(--border-strong); border-radius: 14px;
  padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card-title {
  font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 18px; font-weight: normal;
  display: flex; align-items: center; justify-content: space-between;
}
.section-label {
  font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 10px; opacity: 0.65;
}

/* ── Diamanten ── */
.diamond-badge {
  font-family: -apple-system, sans-serif; font-size: 12px;
  font-weight: 600; color: #60a5fa; letter-spacing: 0.02em;
}

/* ── Brutkasten ── */
.incubator-area { margin-bottom: 16px; }
.incubator-slot {
  min-height: 178px; border: 1.5px dashed var(--border-strong); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 18px; transition: border-color 0.15s, background-color 0.15s;
}
.incubator-slot.drag-over {
  border-color: var(--accent); background-color: rgba(29,158,117,0.05);
}
.drop-hint {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-muted); font-family: -apple-system, sans-serif; font-size: 13px;
  opacity: 0.5; pointer-events: none; text-align: center;
}
.drop-hint-icon { font-size: 26px; }
.egg-display-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.egg-stage-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; user-select: none; }

/* ── Fortschritt ── */
.progress-wrap { width: 100%; }
.progress-track { height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width 0.9s linear; width: 0%; }
.progress-text { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }

/* ── Brutkasten-Buttons ── */
.incubator-buttons { display: flex; gap: 10px; margin-top: 12px; }
.btn-incubator {
  flex: 1; padding: 9px 6px; border-radius: 9px;
  border: 1px solid var(--border-strong); background: var(--surface2);
  color: var(--text); font-family: -apple-system, sans-serif; font-size: 12px;
  cursor: pointer; transition: background 0.15s, opacity 0.15s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.btn-incubator:hover:not(:disabled) { background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.4); }
.btn-incubator:active:not(:disabled) { transform: scale(0.97); }
.btn-incubator:disabled { opacity: 0.32; cursor: not-allowed; }

/* ── Inventar (aufklappbar) ── */
.inv-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; padding: 2px 0;
}
.inv-toggle-btn {
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  font-size: 11px; padding: 0; font-family: -apple-system, sans-serif;
  letter-spacing: 0.04em; pointer-events: none;
}
.inv-content {
  overflow: hidden; max-height: 0;
  transition: max-height 0.32s ease, margin-top 0.32s ease; margin-top: 0;
}
.inv-content.open { max-height: 300px; margin-top: 14px; }

/* ── Inventar-Slots (2×5) ── */
.inv-slots { display: flex; flex-wrap: wrap; gap: 8px; }
.inv-slot {
  width: calc(20% - 7px); min-height: 68px; background: var(--surface2);
  border: 1.5px dashed var(--border); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform 0.1s, opacity 0.15s, background 0.15s;
}
.inv-slot.occupied { border-style: solid; border-color: transparent; cursor: grab; }
.inv-slot.occupied:hover { transform: translateY(-3px); }
.inv-slot.occupied:active { cursor: grabbing; }
.inv-slot.dragging-from { opacity: 0.18; }
.inv-slot.plus-slot { cursor: pointer; gap: 2px; }
.inv-slot.plus-slot:hover { background: rgba(96,165,250,0.1); transform: translateY(-2px); border-color: rgba(96,165,250,0.35); }
.plus-icon { font-size: 18px; color: var(--text-muted); opacity: 0.5; line-height: 1; }
.plus-cost { font-family: -apple-system, sans-serif; font-size: 9px; color: var(--text-muted); opacity: 0.5; }

/* ── Deck-Box ── */
#deckBox .card-title { cursor: pointer; margin-bottom: 0; }
.deck-content { overflow: hidden; max-height: 0; transition: max-height 0.32s ease, margin-top 0.32s ease; margin-top: 0; }
.deck-content.open { max-height: 600px; margin-top: 16px; }
.deck-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.deck-empty { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--text-muted); opacity: 0.5; text-align: center; padding: 12px 0; width: 100%; }
.deck-card-wrap { position: relative; }
.deck-card {
  width: 60px; height: 82px; border-radius: 8px;
  border: 1.5px solid var(--card-color, #999); background: var(--card-bg, #222);
  position: relative; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 4px; cursor: pointer;
}
.deck-card.stack-2::before {
  content: ''; position: absolute; inset: 0; border-radius: 8px;
  border: 1.5px solid var(--card-color, #999); background: var(--card-bg, #222);
  transform: rotate(-3.5deg) translate(-2px, 3px); z-index: -1;
}
.deck-card.stack-3::after {
  content: ''; position: absolute; inset: 0; border-radius: 8px;
  border: 1.5px solid var(--card-color, #999); background: var(--card-bg, #222);
  transform: rotate(3deg) translate(2px, 3px); z-index: -2;
}
.deck-count-badge {
  position: absolute; top: -7px; right: -7px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, sans-serif;
}
.deck-toggle-btn {
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  font-size: 11px; padding: 0; font-family: -apple-system, sans-serif; letter-spacing: 0.04em;
}
.deck-toggle-btn:hover { opacity: 0.7; }

/* ── Animationen ── */
@keyframes shake {
  0%   { transform: rotate(0deg) translateX(0); }
  10%  { transform: rotate(-10deg) translateX(-5px); }
  22%  { transform: rotate(10deg) translateX(5px); }
  34%  { transform: rotate(-10deg) translateX(-5px); }
  46%  { transform: rotate(10deg) translateX(5px); }
  58%  { transform: rotate(-6deg) translateX(-3px); }
  70%  { transform: rotate(6deg) translateX(3px); }
  82%  { transform: rotate(-3deg); }
  92%  { transform: rotate(2deg); }
  100% { transform: rotate(0deg); }
}
@keyframes eggPulse {
  0%, 100% { filter: drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 12px var(--glow)); }
  50%       { filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 28px var(--glow)); }
}
@keyframes textPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes cardReveal {
  0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
  65%  { transform: scale(1.07) rotate(1.5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { from { background-position: -200% center; } to { background-position: 200% center; } }
@keyframes cardPop {
  0%   { transform: scale(0.2); opacity: 0; }
  70%  { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes badgePop {
  0%   { transform: scale(0.5); }
  70%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.shaking  { animation: shake 0.48s ease-in-out; }
.pulsing  { animation: eggPulse 1.7s ease-in-out infinite; }
.ready-text { animation: textPulse 1.4s ease-in-out infinite; }

/* ── Schlüpf-Overlay ── */
#hatchOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.84);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 900; animation: overlayFadeIn 0.25s ease;
}
#hatchOverlay.visible { display: flex; }
.hatch-heading { font-size: 20px; font-weight: normal; letter-spacing: 0.1em; color: #f5f5f0; }
.hatch-card {
  width: min(82vw, 380px); height: min(80vh, 530px);
  border-radius: 14px; border: 2px solid;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px 12px 48px; position: relative; overflow: hidden;
  animation: cardReveal 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.card-bg-glow { position: absolute; inset: 0; opacity: 0.1; }
.rarity-badge {
  font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 800;
  letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 12px;
  border-radius: 20px; position: absolute; bottom: 16px; z-index: 1;
}
.rarity-badge.mystisch {
  background: linear-gradient(90deg, #FF4081, #FF80AB, #FF6EC7, #FF4081);
  background-size: 200% auto; animation: shimmer 2s linear infinite; color: white;
}
.btn-deck {
  font-family: 'Georgia', serif; background: var(--accent); color: #fff; border: none;
  padding: 12px 34px; border-radius: 10px; font-size: 15px; cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.15s, transform 0.1s;
}
.btn-deck:hover { opacity: 0.85; }
.btn-deck:active { transform: scale(0.97); }

/* ── Karten-Ansicht-Overlay ── */
#cardViewOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.84);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 910; cursor: pointer; animation: overlayFadeIn 0.2s ease;
}
#cardViewOverlay.visible { display: flex; }
#cardViewOverlay .hatch-card { animation: cardReveal 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
.card-view-hint {
  font-family: -apple-system, sans-serif; font-size: 11px;
  color: rgba(255,255,255,0.35); letter-spacing: 0.14em; text-transform: uppercase;
}
</style>
</head>
<body>

<div class="test-banner">🧪 Testmodus — Brutzeit: 10 Sekunden (1 Sek = 1 Stunde)</div>

<div id="diamondBanner"></div>

<!-- Ei-Box -->
<div class="card" id="eggBox">
  <div class="card-title">
    <span>🥚 Eier</span>
    <span class="diamond-badge" id="diamondDisplay">💎 20</span>
  </div>

  <div class="incubator-area">
    <div class="section-label">Brutkasten</div>
    <div class="incubator-slot" id="incubatorSlot">
      <div class="drop-hint" id="dropHint">
        <div class="drop-hint-icon">🔥</div>
        Ei aus Inventar hierher ziehen
      </div>
    </div>
    <div class="incubator-buttons">
      <button class="btn-incubator" id="btnMinus1h" disabled>−1h &nbsp;💎1</button>
      <button class="btn-incubator" id="btnSkip" disabled>Überspringen 💎—</button>
    </div>
  </div>

  <div>
    <div class="inv-header" id="invHeader">
      <div class="section-label" style="margin-bottom:0">Inventar</div>
      <button class="inv-toggle-btn" id="invBtn">▼ aufklappen</button>
    </div>
    <div class="inv-content" id="invContent">
      <div class="inv-slots" id="invSlots"></div>
    </div>
  </div>
</div>

<!-- Deck-Box -->
<div class="card" id="deckBox">
  <div class="card-title" id="deckToggle">
    <span>🃏 Meine Karten <span id="deckCount" style="opacity:0.45;font-size:11px">(0)</span></span>
    <button class="deck-toggle-btn" id="deckBtn">▼ aufklappen</button>
  </div>
  <div class="deck-content" id="deckContent">
    <div class="deck-grid" id="deckGrid">
      <div class="deck-empty">Noch keine Karten</div>
    </div>
  </div>
</div>

<!-- Schlüpf-Overlay -->
<div id="hatchOverlay">
  <div class="hatch-heading">Eine neue Karte!</div>
  <div id="hatchCardEl"></div>
  <button class="btn-deck" id="btnDeck">In Deck legen</button>
</div>

<!-- Karten-Ansicht-Overlay -->
<div id="cardViewOverlay">
  <div id="cardViewEl"></div>
  <div class="card-view-hint">Tippen zum Schließen</div>
</div>

<script>
// ── Konstanten ─────────────────────────────────────────────────────────────
const TOTAL_SEC    = 10; // Test: 10 Sek = 10 Fokus-Stunden (1 Sek = 1 h)
const EGG_BUY_COST = 12;

const EGG_COLORS = {
  y: { name: 'Gelb', light: '#FFE87A', dark: '#9A7400', glow: '#F5C518' },
  b: { name: 'Blau', light: '#6EC8F5', dark: '#0C3E8A', glow: '#2196F3' },
  g: { name: 'Grün', light: '#8EDA6A', dark: '#1C5C0C', glow: '#4CAF50' },
  r: { name: 'Rot',  light: '#F07272', dark: '#6A0A0A', glow: '#F44336' },
};

const RARITIES = [
  { name: 'Normal',   key: 'normal',    folder: 'common',    color: '#aaa',    bg: '#28282a', weight: 40 },
  { name: 'Selten',   key: 'selten',    folder: 'rare',      color: '#4da3ff', bg: '#07182e', weight: 30 },
  { name: 'Episch',   key: 'episch',    folder: 'epic',      color: '#c278e8', bg: '#190430', weight: 18 },
  { name: 'Legendär', key: 'legendaer', folder: 'legendary', color: '#ffd700', bg: '#201400', weight: 9  },
  { name: 'Mystisch', key: 'mystisch',  folder: 'mystic',    color: '#ff4fbf', bg: '#1c0020', weight: 3  },
];

const EGG_STAGES = {
  y: ['Eier/yellow/Stadium_1.png','Eier/yellow/Stadium_2.png','Eier/yellow/Stadium_3.png','Eier/yellow/Stadium_4.png'],
  b: ['Eier/blue/Stadium_1.png',  'Eier/blue/Stadium_2.png',  'Eier/blue/Stadium_3.png',  'Eier/blue/Stadium_4.png'],
  g: ['Eier/green/Stadium_1.png', 'Eier/green/Stadium_2.png', 'Eier/green/Stadium_3.png', 'Eier/green/Stadium_4.png'],
  r: ['Eier/red/Stadium_1.png',   'Eier/red/Stadium_2.png',   'Eier/red/Stadium_3.png',   'Eier/red/Stadium_4.png'],
};

const CARD_CATALOG = [
  { id:  1, name: 'FSr-Mitglied',          rarity: 'common',    folder: 'common'    },
  { id:  2, name: 'Glutenboykottierer',     rarity: 'common',    folder: 'common'    },
  { id:  3, name: 'Histotutor',             rarity: 'common',    folder: 'common'    },
  { id:  4, name: 'M1Schwitzer',            rarity: 'common',    folder: 'common'    },
  { id:  5, name: 'Skillslabschauspieler',  rarity: 'common',    folder: 'common'    },
  { id:  6, name: 'Soziologiestudent-in',   rarity: 'common',    folder: 'common'    },
  { id:  7, name: 'Warmduscher',            rarity: 'common',    folder: 'common'    },
  { id:  8, name: 'Anki-Controler-User',    rarity: 'rare',      folder: 'rare'      },
  { id:  9, name: 'Biochemietrader',        rarity: 'rare',      folder: 'rare'      },
  { id: 10, name: 'Mensafrau',              rarity: 'rare',      folder: 'rare'      },
  { id: 11, name: 'Schwesterrabiata',       rarity: 'rare',      folder: 'rare'      },
  { id: 12, name: 'gym10duscher',           rarity: 'rare',      folder: 'rare'      },
  { id: 13, name: 'Medienny',               rarity: 'epic',      folder: 'epic'      },
  { id: 14, name: 'STHebungsüberseher',     rarity: 'epic',      folder: 'epic'      },
  { id: 15, name: 'TomS',                   rarity: 'epic',      folder: 'epic'      },
  { id: 16, name: 'Bibliothek-Schläfer',    rarity: 'legendary', folder: 'legendary' },
  { id: 17, name: 'FreundausHarvard',       rarity: 'legendary', folder: 'legendary' },
  { id: 18, name: 'glasn',                  rarity: 'legendary', folder: 'legendary' },
  { id: 19, name: 'Mediraggy',              rarity: 'legendary', folder: 'legendary' },
  { id: 20, name: 'Neurotutor',             rarity: 'legendary', folder: 'legendary' },
  { id: 21, name: 'Penig-BG',              rarity: 'mystic',    folder: 'mystic'    },
];

const STAGE_SCALE = [1.0, 1.02, 1.08, 1.25];
const BREAK_L = 'polygon(0 0,50% 0,57% 10%,43% 22%,59% 34%,41% 47%,58% 59%,44% 71%,54% 83%,47% 100%,0 100%)';
const BREAK_R = 'polygon(47% 100%,54% 83%,44% 71%,58% 59%,41% 47%,59% 34%,43% 22%,57% 10%,50% 0,100% 0,100% 100%)';

// ── State ──────────────────────────────────────────────────────────────────
// 10 Slots; null = leer
let inventory = [
  { id: 1, color: 'y' }, { id: 2, color: 'b' }, { id: 3, color: 'g' }, { id: 4, color: 'r' },
  null, null, null, null, null, null,
];
let diamonds      = 20;
let invOpen       = false;
let incubatorEgg  = null; // { id, color, startTime, bonusSec }
let timerInterval = null;
let draggedId     = null;
let currentCard   = null;
let deck          = [];
let deckOpen      = false;
let nextEggId     = 5;
let bannerTimeout = null;

// ── Ei-Hilfsfunktionen ─────────────────────────────────────────────────────
function stageToFrame(stage) {
  if (stage === 'ready') return 3;
  if (stage >= 2) return 2;
  return stage;
}

function eggSprite(colorNum, stage, px) {
  const frame = stageToFrame(stage);
  const src   = (EGG_STAGES[colorNum] || EGG_STAGES['y'])[frame];
  const w     = Math.round(px * STAGE_SCALE[frame]);
  return `<img src="${src}" width="${w}" style="display:block;">`;
}

function getProgress() {
  if (!incubatorEgg) return 0;
  const elapsed = Math.floor((Date.now() - incubatorEgg.startTime) / 1000);
  return Math.min(elapsed + incubatorEgg.bonusSec, TOTAL_SEC);
}

function getCrackStage(sec) {
  if (sec >= TOTAL_SEC)         return 'ready';
  if (sec >= TOTAL_SEC * 0.7)  return 2;
  if (sec >= TOTAL_SEC * 0.35) return 1;
  return 0;
}

// ── Diamanten ──────────────────────────────────────────────────────────────
function renderDiamonds() {
  document.getElementById('diamondDisplay').textContent = '💎 ' + diamonds;
}

function showDiamondError() {
  const banner = document.getElementById('diamondBanner');
  banner.textContent = 'Du bist anscheinend gesetzlich versichert. Verdiene mehr Diamanten und probiere es nochmal!';
  banner.classList.add('visible');
  if (bannerTimeout) clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => banner.classList.remove('visible'), 4000);
}

// ── Inventar ───────────────────────────────────────────────────────────────
function toggleInv() {
  invOpen = !invOpen;
  document.getElementById('invContent').classList.toggle('open', invOpen);
  document.getElementById('invBtn').textContent = invOpen ? '▲ zuklappen' : '▼ aufklappen';
}
document.getElementById('invHeader').addEventListener('click', toggleInv);

function renderInventory() {
  const c = document.getElementById('invSlots');
  c.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const egg  = inventory[i];
    const slot = document.createElement('div');
    if (egg) {
      slot.className   = 'inv-slot occupied';
      slot.innerHTML   = eggSprite(egg.color, 0, 36);
      slot.draggable   = true;
      slot.dataset.idx = i;
      slot.addEventListener('dragstart', (e) => {
        draggedId = egg.id;
        setTimeout(() => slot.classList.add('dragging-from'), 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      slot.addEventListener('dragend', () => {
        slot.classList.remove('dragging-from');
        draggedId = null;
      });
    } else {
      slot.className = 'inv-slot plus-slot';
      slot.innerHTML  = `<span class="plus-icon">+</span><span class="plus-cost">${EGG_BUY_COST} 💎</span>`;
      slot.addEventListener('click', buyEgg);
    }
    c.appendChild(slot);
  }
}

function buyEgg() {
  const freeIdx = inventory.findIndex(e => e === null);
  if (freeIdx === -1) return;
  if (diamonds < EGG_BUY_COST) { showDiamondError(); return; }
  diamonds -= EGG_BUY_COST;
  const EGG_COLOR_IDS = ['y', 'b', 'g', 'r'];
  inventory[freeIdx] = { id: nextEggId++, color: EGG_COLOR_IDS[Math.floor(Math.random() * 4)] };
  renderDiamonds();
  renderInventory();
}

// ── Brutkasten ─────────────────────────────────────────────────────────────
function renderIncubator() {
  const slot = document.getElementById('incubatorSlot');
  const hint = document.getElementById('dropHint');
  slot.querySelectorAll('.egg-display-wrap').forEach(el => el.remove());

  if (!incubatorEgg) {
    hint.style.display = '';
    renderIncubatorButtons();
    return;
  }
  hint.style.display = 'none';

  const progress  = getProgress();
  const stage     = getCrackStage(progress);
  const pct       = Math.min((progress / TOTAL_SEC) * 100, 100);
  const remaining = Math.max(TOTAL_SEC - progress, 0);
  const isReady   = stage === 'ready';
  const glow      = EGG_COLORS[incubatorEgg.color].glow;

  const wrap = document.createElement('div');
  wrap.className = 'egg-display-wrap';
  wrap.innerHTML = `
    <div class="egg-stage-wrap ${isReady ? 'pulsing' : ''}"
         id="incEggWrap"
         style="--glow:${glow};${isReady ? 'cursor:pointer' : ''}">
      ${eggSprite(incubatorEgg.color, stage, 88)}
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%;${isReady ? 'background:'+glow : ''}"></div>
      </div>
      <div class="progress-text ${isReady ? 'ready-text' : ''}">
        ${isReady ? '✨ Schlüpfbereit — klicken!' : `noch ${remaining}s`}
      </div>
    </div>`;
  slot.appendChild(wrap);

  if (isReady) document.getElementById('incEggWrap').addEventListener('click', startHatch);
  renderIncubatorButtons();
}

function renderIncubatorButtons() {
  const progress  = getProgress();
  const remaining = Math.max(TOTAL_SEC - progress, 0);
  const skipCost  = Math.ceil(remaining);
  const hasEgg    = !!incubatorEgg;
  const timeLeft  = remaining > 0;

  const btnM = document.getElementById('btnMinus1h');
  const btnS = document.getElementById('btnSkip');
  btnM.disabled = !hasEgg || !timeLeft;
  btnS.disabled = !hasEgg || !timeLeft;
  btnS.innerHTML = `Überspringen &nbsp;💎${skipCost}`;
}

document.getElementById('btnMinus1h').addEventListener('click', () => {
  if (!incubatorEgg) return;
  if (diamonds < 1) { showDiamondError(); return; }
  if (Math.max(TOTAL_SEC - getProgress(), 0) <= 0) return;
  diamonds -= 1;
  incubatorEgg.bonusSec = Math.min(incubatorEgg.bonusSec + 1, TOTAL_SEC);
  renderDiamonds();
  renderIncubator();
});

document.getElementById('btnSkip').addEventListener('click', () => {
  if (!incubatorEgg) return;
  const remaining = Math.max(TOTAL_SEC - getProgress(), 0);
  if (remaining <= 0) return;
  const cost = Math.ceil(remaining);
  if (diamonds < cost) { showDiamondError(); return; }
  diamonds -= cost;
  incubatorEgg.bonusSec = TOTAL_SEC;
  renderDiamonds();
  renderIncubator();
});

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() { stopTimer(); timerInterval = setInterval(() => renderIncubator(), 1000); }
function stopTimer()  { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

function preloadEggStages(colorNum) {
  const old = document.getElementById('eggPreload');
  if (old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'eggPreload';
  wrap.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;';
  (EGG_STAGES[colorNum] || EGG_STAGES[1]).forEach(src => {
    const img = new Image(); img.src = src; wrap.appendChild(img);
  });
  document.body.appendChild(wrap);
}

// ── Drag & Drop ────────────────────────────────────────────────────────────
const incSlot = document.getElementById('incubatorSlot');
incSlot.addEventListener('dragover', (e) => {
  if (incubatorEgg) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  incSlot.classList.add('drag-over');
});
incSlot.addEventListener('dragleave', (e) => {
  if (!incSlot.contains(e.relatedTarget)) incSlot.classList.remove('drag-over');
});
incSlot.addEventListener('drop', (e) => {
  e.preventDefault(); incSlot.classList.remove('drag-over');
  if (incubatorEgg || !draggedId) return;
  const idx = inventory.findIndex(eg => eg && eg.id === draggedId);
  if (idx === -1) return;
  const egg = inventory[idx];
  inventory[idx] = null;
  incubatorEgg = { ...egg, startTime: Date.now(), bonusSec: 0 };
  draggedId = null;
  preloadEggStages(egg.color);
  renderInventory(); renderIncubator(); startTimer();
});

// ── Schlüpf-Sequenz ────────────────────────────────────────────────────────
function startHatch() {
  if (!incubatorEgg) return;
  stopTimer();
  const wrap = document.getElementById('incEggWrap');
  if (!wrap) return;
  wrap.classList.add('shaking');
  setTimeout(() => splitEgg(wrap), 480);
}

function splitEgg(wrapEl) {
  const rect  = wrapEl.getBoundingClientRect();
  const color = EGG_COLORS[incubatorEgg.color];
  spawnChips(rect, color);

  function makeHalf(clip, tx, ty, rot) {
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;
      width:${rect.width}px;height:${rect.height}px;
      clip-path:${clip};z-index:802;pointer-events:none;`;
    d.innerHTML = wrapEl.innerHTML;
    document.body.appendChild(d);
    d.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 540, easing: 'ease-in', fill: 'forwards' });
    return d;
  }

  const lh = makeHalf(BREAK_L, -88, -60, -48);
  const rh = makeHalf(BREAK_R,  88, -54,  48);
  wrapEl.style.visibility = 'hidden';

  setTimeout(() => {
    lh.remove(); rh.remove();
    currentCard = rollCard(rollRarity());
    showHatchOverlay(currentCard);
  }, 540);
}

function spawnChips(rect, color) {
  const count = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    const chip = document.createElement('div');
    const w = 4 + Math.random() * 11, h = 3 + Math.random() * 9;
    chip.style.cssText = `
      position:fixed;
      left:${rect.left + rect.width  * (0.18 + Math.random() * 0.64)}px;
      top:${rect.top  + rect.height * (0.12 + Math.random() * 0.76)}px;
      width:${w}px; height:${h}px; background:${color.light};
      border:0.5px solid ${color.dark};
      border-radius:${Math.random() > 0.55 ? '2px' : '0'};
      z-index:803; pointer-events:none; transform-origin:center;`;
    document.body.appendChild(chip);
    const angle = Math.random() * 2 * Math.PI;
    const speed = 70 + Math.random() * 120;
    chip.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 0.95 },
      { transform: `translate(${Math.cos(angle)*speed}px,${Math.sin(angle)*speed+25}px) rotate(${(Math.random()-0.5)*800}deg) scale(0.1)`, opacity: 0 },
    ], { duration: 500 + Math.random()*320, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => chip.remove(), 950);
  }
}

// ── Karten-Draw ────────────────────────────────────────────────────────────
function rollRarity() {
  const roll = Math.random() * 100;
  let cum = 0;
  for (const r of RARITIES) { cum += r.weight; if (roll < cum) return r; }
  return RARITIES[0];
}

function rollCard(rarity) {
  const pool  = CARD_CATALOG.filter(c => c.folder === rarity.folder);
  const entry = pool[Math.floor(Math.random() * pool.length)];
  return { ...entry, src: encodeURI(`Karten/${entry.folder}/${entry.name}.png`), rarity };
}

function showHatchOverlay(card) {
  const { rarity, src } = card;
  const isMyst = rarity.key === 'mystisch';
  document.getElementById('hatchCardEl').innerHTML = `
    <div class="hatch-card"
         style="border-color:${rarity.color};
                box-shadow:0 0 30px ${rarity.color}66,0 0 60px ${rarity.color}22;
                background:${rarity.bg}">
      <div class="card-bg-glow" style="background:${rarity.color}"></div>
      <img src="${src}" style="width:100%;height:100%;object-fit:contain;padding:8px;position:relative;z-index:1;">
      <div class="rarity-badge ${isMyst ? 'mystisch' : ''}"
        style="${isMyst ? '' : `background:${rarity.color}20;color:${rarity.color};border:1px solid ${rarity.color}44`}">
        ${rarity.name}
      </div>
    </div>`;
  document.getElementById('hatchOverlay').classList.add('visible');
}

// ── Karte ins Deck ─────────────────────────────────────────────────────────
document.getElementById('btnDeck').addEventListener('click', () => {
  if (!currentCard) return;
  const card    = currentCard;
  const rarity  = card.rarity;
  const overlay = document.getElementById('hatchOverlay');
  const cardEl  = document.getElementById('hatchCardEl').querySelector('.hatch-card');
  const deckBox = document.getElementById('deckBox');

  if (!deckOpen) toggleDeck();
  deckBox.scrollIntoView({ behavior: 'instant', block: 'nearest' });

  const cRect = cardEl.getBoundingClientRect();
  const dRect = deckBox.getBoundingClientRect();

  const fly = document.createElement('div');
  fly.style.cssText = `
    position:fixed;
    left:${cRect.left}px; top:${cRect.top}px;
    width:${cRect.width}px; height:${cRect.height}px;
    z-index:950; pointer-events:none;
    border-radius:14px; border:2px solid ${rarity.color};
    background:${rarity.bg}; box-shadow:0 0 20px ${rarity.color}55; overflow:hidden;`;
  fly.innerHTML = `<img src="${card.src}" style="width:100%;height:100%;object-fit:contain;padding:4px;">`;
  document.body.appendChild(fly);

  overlay.classList.remove('visible');

  const tx  = (dRect.left + dRect.width  * 0.14) - (cRect.left + cRect.width  / 2);
  const ty  = (dRect.top  + dRect.height * 0.5)  - (cRect.top  + cRect.height / 2);
  const rot = (Math.random() - 0.5) * 22;

  fly.animate([
    { transform: 'translate(0,0) scale(1) rotate(0deg)',                                 opacity: 1,    offset: 0    },
    { transform: `translate(${tx*.55}px,${ty*.45}px) scale(0.68) rotate(${rot*.4}deg)`, opacity: 0.95, offset: 0.48 },
    { transform: `translate(${tx}px,${ty}px) scale(0.3) rotate(${rot}deg)`,              opacity: 0.5,  offset: 1    },
  ], { duration: 680, easing: 'cubic-bezier(0.4,0,0.2,1)', fill: 'forwards' })
  .onfinish = () => {
    fly.remove();
    addToDeck(card);
    currentCard  = null;
    incubatorEgg = null;
    renderInventory();
    renderIncubator();
    deckBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
});

// ── Deck-Logik ─────────────────────────────────────────────────────────────
function addToDeck(card) {
  const ex = deck.find(c => c.id === card.id);
  if (ex) { ex.count++; renderDeck(card.id, true); }
  else {
    deck.push({ ...card, count: 1 });
    deck.sort((a, b) => a.rarity.weight - b.rarity.weight);
    renderDeck(card.id, false);
  }
}

function renderDeck(highlightId, isDuplicate) {
  const grid    = document.getElementById('deckGrid');
  const countEl = document.getElementById('deckCount');
  countEl.textContent = `(${deck.reduce((s, c) => s + c.count, 0)})`;

  if (deck.length === 0) {
    grid.innerHTML = '<div class="deck-empty">Noch keine Karten</div>';
    return;
  }

  grid.innerHTML = '';
  deck.forEach(({ id, name, src, rarity, count }) => {
    const safeId     = 'c' + id;
    const stackClass = count >= 3 ? 'stack-2 stack-3' : count === 2 ? 'stack-2' : '';
    const isNew      = highlightId === id && !isDuplicate;
    const isBump     = highlightId === id && isDuplicate;

    const wrap = document.createElement('div');
    wrap.className = 'deck-card-wrap';
    wrap.innerHTML = `
      <div class="deck-card ${stackClass}"
           style="--card-color:${rarity.color};--card-bg:${rarity.bg}"
           id="dc_${safeId}">
        ${count > 1 ? `<div class="deck-count-badge" id="dcb_${safeId}">×${count}</div>` : ''}
        <img src="${src}" style="width:100%;height:100%;object-fit:contain;border-radius:4px;pointer-events:none;">
      </div>`;
    grid.appendChild(wrap);
    wrap.querySelector('.deck-card').addEventListener('click', () => showCardView({ name, src, rarity }));

    if (isNew) {
      const dc = document.getElementById(`dc_${safeId}`);
      if (dc) dc.style.animation = 'cardPop 0.38s cubic-bezier(0.34,1.56,0.64,1) both';
    }
    if (isBump) {
      requestAnimationFrame(() => {
        const badge = document.getElementById(`dcb_${safeId}`);
        if (badge) badge.style.animation = 'badgePop 0.32s cubic-bezier(0.34,1.56,0.64,1) both';
      });
    }
  });
}

// ── Karten-Ansicht ─────────────────────────────────────────────────────────
function showCardView(card) {
  const { rarity, src } = card;
  const isMyst = rarity.key === 'mystisch';
  document.getElementById('cardViewEl').innerHTML = `
    <div class="hatch-card"
         style="border-color:${rarity.color};
                box-shadow:0 0 30px ${rarity.color}66,0 0 60px ${rarity.color}22;
                background:${rarity.bg}">
      <div class="card-bg-glow" style="background:${rarity.color}"></div>
      <img src="${src}" style="width:100%;height:100%;object-fit:contain;padding:8px;position:relative;z-index:1;">
      <div class="rarity-badge ${isMyst ? 'mystisch' : ''}"
        style="${isMyst ? '' : `background:${rarity.color}20;color:${rarity.color};border:1px solid ${rarity.color}44`}">
        ${rarity.name}
      </div>
    </div>`;
  document.getElementById('cardViewOverlay').classList.add('visible');
}
document.getElementById('cardViewOverlay').addEventListener('click', () => {
  document.getElementById('cardViewOverlay').classList.remove('visible');
});

// ── Deck-Toggle ────────────────────────────────────────────────────────────
function toggleDeck() {
  deckOpen = !deckOpen;
  document.getElementById('deckContent').classList.toggle('open', deckOpen);
  document.getElementById('deckBtn').textContent = deckOpen ? '▲ zuklappen' : '▼ aufklappen';
}
document.getElementById('deckToggle').addEventListener('click', toggleDeck);

// ── Init ───────────────────────────────────────────────────────────────────
renderDiamonds();
renderInventory();
renderIncubator();
renderDeck(null, false);
// Inventar beim Start aufgeklappt, damit Eier sofort sichtbar sind
toggleInv();
</script>
