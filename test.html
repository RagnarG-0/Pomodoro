<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animations-Test — Pomodoro</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #eeede9;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --text: #1a1a18;
    --text-muted: #6b6b66;
    --accent: #1D9E75;
    --accent-dark: #0F6E56;
    --string-color: rgba(0,0,0,0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1e1e1c;
      --surface2: #272725;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0efe9;
      --text-muted: #8a8a82;
      --accent: #1D9E75;
      --accent-dark: #5DCAA5;
      --string-color: rgba(255,255,255,0.32);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 2rem 2.25rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 28px rgba(0,0,0,0.10);
    text-align: center;
  }

  h1 {
    font-size: 1rem;
    font-weight: normal;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 1.5rem;
  }

  select#anim-select {
    width: 100%;
    padding: 0.65rem 0.75rem;
    margin-bottom: 1.25rem;
    border-radius: 8px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface2);
    color: var(--text);
    font-family: Georgia, serif;
    font-size: 0.92rem;
  }

  button#trigger-btn {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: Georgia, serif;
    font-size: 1rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button#trigger-btn:hover { background: var(--accent-dark); }
  button#trigger-btn:active { transform: scale(0.98); }

  .hint {
    margin-top: 1rem;
    font-size: 0.76rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* ── FX layers ── */
  #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 150; }
  #balloon-layer { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }

  .balloon {
    position: absolute;
    bottom: -140px;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    box-shadow:
      inset -6px -8px 14px rgba(0,0,0,0.18),
      inset 6px 8px 14px rgba(255,255,255,0.25);
  }
  .balloon::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 38px;
    background: var(--string-color);
    transform: translateX(-50%);
  }

  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); }
    50%  { transform: translateY(-62vh) translateX(var(--sway)) rotate(var(--rot)); }
    100% { transform: translateY(-130vh) translateX(calc(var(--sway) * 1.6)) rotate(0deg); }
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>
<div id="balloon-layer"></div>

<div class="panel">
  <h1>Animations-Test</h1>
  <select id="anim-select">
    <option value="confetti">Konfetti</option>
    <option value="fw">Feuerwerk</option>
    <option value="bal">Ballons</option>
    <option value="random">Zufällig (wie später in der App)</option>
  </select>
  <button id="trigger-btn">Pomodoro abschließen ✓</button>
  <p class="hint">Animation im Dropdown wählen und auf den Button klicken. „Zufällig" simuliert das spätere Verhalten: eine von drei Kategorien (Konfetti / Feuerwerk / Ballons) wird zufällig gewählt.</p>
</div>

<script>
(function() {
  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* ══════════════════════════════════════════════
     Konfetti — 1:1 aus index.html übernommen
  ══════════════════════════════════════════════ */
  function launchConfetti() {
    const canvas = document.getElementById('fx-canvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#1D9E75','#5DCAA5','#9FE1CB','#0F6E56','#FAC775','#F09595','#AFA9EC','#F5C4B3','#fff'];
    const pieces = Array.from({length:140}, () => ({
      x: Math.random()*canvas.width, y: -10-Math.random()*300,
      r: 3.5+Math.random()*5, color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5)*3.5, vy: 2+Math.random()*3.5,
      tilt: Math.random()*Math.PI*2, ts: (Math.random()-0.5)*0.18,
      shape: Math.random()>0.4?'rect':'circle', w:6+Math.random()*8, h:3+Math.random()*5,
    }));
    let frame; let done = false;
    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let alive = false;
      for (const p of pieces) {
        p.x+=p.vx; p.y+=p.vy; p.tilt+=p.ts; p.vy+=0.05;
        if (p.y < canvas.height+20) alive = true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.tilt);
        ctx.globalAlpha = Math.max(0,Math.min(1,1-p.y/(canvas.height*1.05)));
        ctx.fillStyle = p.color;
        if (p.shape==='rect') ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
        ctx.restore();
      }
      if (alive&&!done) frame=requestAnimationFrame(loop);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    frame=requestAnimationFrame(loop);
    setTimeout(()=>{ done=true; cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height); },4500);
  }

  /* ══════════════════════════════════════════════
     Feuerwerk
     Raketen steigen geradlinig auf, explodieren in
     runden Partikel-Bursts mit Schwerkraft.
  ══════════════════════════════════════════════ */
  function launchFireworks() {
    const canvas = document.getElementById('fx-canvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF9F45','#C780FA','#ffffff'];
    let rockets = [], particles = [], done = false, frame;

    function spawnRocket() {
      rockets.push({
        x: rand(canvas.width*0.12, canvas.width*0.88),
        y: canvas.height + 10,
        targetY: rand(canvas.height*0.14, canvas.height*0.48),
        vy: -rand(10,14),
        color: pick(colors),
        trail: []
      });
    }
    for (let i=0;i<9;i++) setTimeout(spawnRocket, i*340 + rand(0,160));

    function explode(r) {
      const count = 70;
      for (let i=0;i<count;i++) {
        const angle = (Math.PI*2*i)/count + rand(-0.06,0.06);
        const speed = rand(2.2,6.2);
        particles.push({
          x:r.x, y:r.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
          color:r.color, life:1, decay: rand(0.012,0.02)
        });
      }
    }

    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);

      rockets.forEach(r => {
        r.trail.push({x:r.x,y:r.y});
        if (r.trail.length > 6) r.trail.shift();
        r.y += r.vy;
        ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.55;
        ctx.beginPath();
        r.trail.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
        ctx.stroke();
        ctx.globalAlpha = 1;
      });
      rockets = rockets.filter(r => {
        if (r.y <= r.targetY) { explode(r); return false; }
        return true;
      });

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.vx *= 0.985; p.life -= p.decay;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      particles = particles.filter(p => p.life > 0);

      if (!done) frame = requestAnimationFrame(loop);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    frame = requestAnimationFrame(loop);
    setTimeout(() => { done = true; cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height); }, 5800);
  }

  /* ══════════════════════════════════════════════
     Ballons — gemeinsamer Helper
  ══════════════════════════════════════════════ */
  function spawnBalloon(opts) {
    const el = document.createElement('div');
    el.className = 'balloon';
    el.style.left = opts.left + '%';
    el.style.width = opts.size + 'px';
    el.style.height = (opts.size * 1.18) + 'px';
    el.style.background = opts.bg;
    el.style.setProperty('--sway', opts.sway + 'px');
    el.style.setProperty('--rot', opts.rot + 'deg');
    el.style.animation = opts.anim + ' ' + opts.dur + 's ' + opts.ease + ' ' + opts.delay + 's forwards';
    document.getElementById('balloon-layer').appendChild(el);
    el.addEventListener('animationend', () => {
      if (opts.onEnd) opts.onEnd(el); else el.remove();
    }, { once: true });
    return el;
  }

  /* Ballons — Aufsteigend (klassisches Schweben mit Schlingern, verschwindet erst am oberen Bildschirmrand) */
  function launchBalloons() {
    const palette = ['#FF6B6B','#4D96FF','#FFD93D','#6BCB77','#C780FA','#FF9F45'];
    for (let i = 0; i < 14; i++) {
      const size = rand(36, 56);
      spawnBalloon({
        left: rand(3, 92), size,
        bg: `radial-gradient(circle at 32% 26%, rgba(255,255,255,0.55), ${pick(palette)} 72%)`,
        sway: rand(-70, 70), rot: rand(-12, 12),
        anim: 'rise', dur: rand(3.6, 4.8), delay: rand(0, 0.8), ease: 'linear'
      });
    }
  }

  /* ══════════════════════════════════════════════
     Steuerung
  ══════════════════════════════════════════════ */
  const ANIMATIONS = {
    confetti: launchConfetti,
    fw: launchFireworks,
    bal: launchBalloons,
  };
  const RANDOM_POOL = [launchConfetti, launchFireworks, launchBalloons];

  document.getElementById('trigger-btn').addEventListener('click', () => {
    const val = document.getElementById('anim-select').value;
    if (val === 'random') pick(RANDOM_POOL)();
    else (ANIMATIONS[val] || launchConfetti)();
  });
})();
</script>

</body>
</html>
